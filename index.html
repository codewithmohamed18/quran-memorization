<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#124c3d"><meta name="description" content="A calm Quran memorization companion. Listen, repeat, recite and build a daily revision habit."><title>Hifz · Quran memorization</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=2.0.2"></head>
<body>
<div class="app-shell">
<aside class="sidebar"><a href="#practice" class="brand" aria-label="Hifz home"><img src="icon.svg" alt=""><span>hifz<span class="brand-sub">QUR’AN COMPANION</span></span></a>
<nav class="navigation" aria-label="Main navigation"><button data-view="practice" class="active"><span data-icon="practice"></span>Practice</button><button data-view="library"><span data-icon="book"></span>Qur’an</button><button data-view="revision"><span data-icon="repeat"></span>Review<span id="due-count" class="count">0</span></button><button data-view="progress"><span data-icon="chart"></span>Progress</button></nav>
<div class="sidebar-bottom"><button data-action="settings"><span data-icon="settings"></span>Settings</button><button data-action="help"><span data-icon="help"></span>How to use Hifz</button><div class="local-note"><span data-icon="shield"></span><span>Your progress stays<br>on this device.</span></div></div></aside>
<main>
<header class="topbar"><div class="mobile-brand"><img src="icon.svg" alt="">hifz</div><div class="breadcrumb" id="breadcrumb">Your daily practice</div><div class="top-actions"><button class="icon-button" data-action="theme" aria-label="Change light or dark theme"><span data-icon="moon"></span></button><button class="icon-button" data-action="focus" aria-label="Toggle focus mode"><span data-icon="expand"></span></button><button class="icon-button" data-action="settings" aria-label="Open settings"><span data-icon="settings"></span></button></div></header>
<div id="app-content" aria-live="off"><div class="loading"><div class="loader"></div><h1>Opening your Qur’an…</h1><p>The complete text will be ready for offline reading after your first visit.</p></div></div>
<footer class="app-footer">A companion for practice. A teacher for precise recitation.</footer>
</main></div>
<nav class="mobile-nav" aria-label="Mobile navigation"><button data-view="practice" class="active"><span data-icon="practice"></span>Practice</button><button data-view="library"><span data-icon="book"></span>Qur’an</button><button data-view="revision"><span data-icon="repeat"></span>Review</button><button data-view="progress"><span data-icon="chart"></span>Progress</button></nav>
<div id="player" class="player" hidden><button class="icon-button" id="audio-toggle" aria-label="Pause recitation"><span data-icon="pause"></span></button><div class="player-info"><strong id="audio-title">Recitation</strong><span id="audio-subtitle"></span><span id="audio-note" class="small"></span><span id="audio-status" role="status" aria-live="polite"></span><div class="audio-recovery"><button id="audio-retry" hidden>Retry</button><button id="audio-qari">Choose qāri</button></div></div><input id="audio-seek" type="range" value="0" min="0" max="100" aria-label="Recitation position"><span id="audio-time">0:00</span><button class="icon-button" data-action="stop-audio" aria-label="Stop recitation"><span data-icon="close"></span></button></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button class="icon-button" id="modal-close" aria-label="Close dialog"><span data-icon="close"></span></button></div><div id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js?v=2.0.2"></script>
</body></html>
